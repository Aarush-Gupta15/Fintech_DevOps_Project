# CI/CD Pipeline - GitHub Actions + Argo CD
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  BACKEND_IMAGE: aarushgupta/fintech-backend
  FRONTEND_IMAGE: aarushgupta/fintech-frontend

jobs:
  # ========== Stage 1: Test ==========
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm test --if-present

      - name: Start server and test health
        run: |
          node server.js &
          sleep 3
          curl -f http://localhost:3000/api/health || exit 1
          kill %1

  # ========== Stage 2: Build & Push Docker Images ==========
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=${TAG:0:7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

      # Scan for vulnerabilities
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ========== Stage 3: Update K8s Manifests (triggers Argo CD) ==========
  deploy:
    name: Deploy via Argo CD
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Update image tags in K8s manifests - Argo CD detects the change
      - name: Update image tags in manifests
        run: |
          TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s|image: aarushgupta/fintech-backend:.*|image: aarushgupta/fintech-backend:${TAG}|" k8s/backend-deployment.yaml
          sed -i "s|image: aarushgupta/fintech-frontend:.*|image: aarushgupta/fintech-frontend:${TAG}|" k8s/frontend-deployment.yaml

      - name: Commit and push updated manifests
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add k8s/
          git commit -m "ci: update image tags to ${{ needs.build.outputs.image_tag }}" || exit 0
          git push

      # Argo CD auto-syncs from Git, but we can force sync if needed
      - name: Trigger Argo CD Sync (optional)
        if: always()
        run: |
          echo "Argo CD will auto-detect the Git change and sync."
          echo "Image tag deployed: ${{ needs.build.outputs.image_tag }}"

  # ========== Stage 4: Rollback on Failure ==========
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Revert to previous commit
        run: |
          git revert HEAD --no-edit
          git push
          echo "Rolled back deployment. Argo CD will sync to previous state."
